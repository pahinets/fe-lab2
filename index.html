<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товстоп'ят О. О., ІО-42, Лаб. роб. №2, Варіант 3</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 700px;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        td {
            border: 2px solid #555555;
            padding: 10px;
            height: 28px;
            width: 25%;
            text-align: center;
            font-weight: bold;
        }
        /* Кольори за варіантом (nn = 03; якщо брати №83 у списку — заміни 03 на 83) */
        .row-1 {
            background-color: #038f8f;
            color: #ffffff;
        }
        .row-2 {
            background-color: #f5f503;
            color: #1a1a1a;
        }
        /* Зміна кольорів на протилежні при наведенні */
        .row-1:hover {
            background-color: #f5f503;
            color: #1a1a1a;
        }
        .row-2:hover {
            background-color: #038f8f;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h3>Завдання 1. Таблиця (Варіант 3)</h3>
    <table>
        <tr class="row-1">
            <td rowspan="2">Товстоп'ят</td>
            <td>Олександр</td>
            <td rowspan="2" colspan="2">Олегович</td>
        </tr>
        <tr class="row-2">
            <td>ІО-42, ЛР-2, Варіант 3</td>
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td colspan="2">&nbsp;</td>
        </tr>
    </table>

    <h3>Завдання 2. Зображення засобами CSS (Варіант 3)</h3>
    <div class="shapes-wrapper">
        <div>
            <p>1. За допомогою position:</p>
            <div class="canvas pos-container">
                <div class="sq sq-top"></div>
                <div class="sq sq-left"></div>
                <div class="sq sq-right"></div>
            </div>
        </div>
        <div>
            <p>2. За допомогою transform:</p>
            <div class="canvas trans-container">
                <div class="sq sq-top"></div>
                <div class="sq sq-left"></div>
                <div class="sq sq-right"></div>
            </div>
        </div>
    </div>

</body>
</html>
